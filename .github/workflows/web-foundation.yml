name: Web Foundation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - feature/foundation-and-core
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  validate-web:
    name: Typecheck and build web app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
