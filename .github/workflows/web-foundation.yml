name: Web Foundation

# Run automatically for relevant branches and allow manual validation from GitHub Actions.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - feature/foundation-and-core
  pull_request:
    branches:
      - main
      - develop

# The validation job only needs read access to repository contents.
permissions:
  contents: read

jobs:
  validate-web:
    name: Typecheck and build web app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      # Allow dependency installation before the project lockfile is committed.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Reject type errors before validating the production build.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
